<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Management - DriveRentals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">

    <link rel="stylesheet" href="../assets/css/style.css">

    <style>

        body {
            min-height: 100vh;
            margin: 0;

            background:
                linear-gradient(
                    rgba(5,20,45,0.75),
                    rgba(5,20,45,0.75)
                ),
                url("../assets/images/vehi_manage.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

    </style>

</head>
</head>
<body>

<!-- Navbar -->
<div id="navbar-placeholder"></div>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Vehicle Management</h2>
        <!-- Button to open the Add Vehicle Modal -->
        <button class="btn btn-accent" data-bs-toggle="modal" data-bs-target="#addVehicleModal">+ Add New Vehicle</button>
    </div>

    <!-- Vehicle Data Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Registration</th>
                    <th>Make & Model</th>
                    <th>Year</th>
                    <th>Daily Rate</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody id="admin-vehicle-table">
                <tr><td colspan="6" class="text-center text-muted">Loading vehicles...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Vehicle Modal -->
<div class="modal fade" id="addVehicleModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Add New Vehicle</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="addVehicleForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Registration Number</label>
                        <input type="text" class="form-control" id="regNumber" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Make (e.g., Toyota)</label>
                            <input type="text" class="form-control" id="make" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Model (e.g., Camry)</label>
                            <input type="text" class="form-control" id="model" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" id="categoryId" required><option value="">Select category</option></select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Branch</label>
                            <select class="form-select" id="branchId" required><option value="">Select branch</option></select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Year</label>
                            <input type="number" class="form-control" id="year" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Daily Rate (LKR)</label>
                            <input type="number" class="form-control" id="dailyRate" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-accent">Save Vehicle</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/vehicle-management.js"></script>
</body>
</html>

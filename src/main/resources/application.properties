# Server Port
server.port=8080

# Database Connection (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vehicle_rental_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:nima123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Serve the existing vanilla HTML/CSS/JS frontend from the same Spring Boot app.
# Open the complete application at http://localhost:8080 after starting Maven.
spring.web.resources.static-locations=file:./frontend/,classpath:/static/

# Session cookie used by customer and staff authentication.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
